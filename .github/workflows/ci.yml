name: CI

on:
    push:
        branches:
            - main
            - master
            - production
            - "agent/**"
        tags:
            - "v*"
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        name: Go and TypeScript checks (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Install Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Run repository checks
              if: matrix.os == 'ubuntu-latest'
              run: bash scripts/ci.sh

            - name: Run repository checks on Windows
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: ./scripts/ci.ps1

            - name: Run race detector
              if: matrix.os == 'ubuntu-latest'
              run: go test -race ./...
