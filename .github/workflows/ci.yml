name: CI

on:
    push:
        branches:
            - main
            - master
            - production
            - "agent/**"
        tags:
            - "v*"
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        name: Go and TypeScript checks
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Install Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Run repository checks
              run: bash scripts/ci.sh

            - name: Run race detector
              run: go test -race ./...
